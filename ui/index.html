<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>戗角工作台</title><link rel="stylesheet" href="/ui/styles.css"><script src="/ui/app.js" defer></script></head><body>
<header class="topbar"><div class="brand"><div aria-hidden="true" class="brand-mark">
<svg role="presentation" viewbox="0 0 42 42">
<path d="M7 29.5 21 8l14 21.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
<path d="M11 29.5h20M15.4 22.8h11.2M21 9v20.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>
<circle cx="21" cy="30" fill="currentColor" r="2.1"></circle>
</svg>
</div><strong>戗角工作台</strong></div><div class="scheme-name" id="result-title">角部方案</div><div class="top-actions"><button id="history-open" class="quiet-button">历史</button><button id="export-open" class="green-button">导出</button></div></header>
<main class="canvas-area"><div class="canvas-frame"><div class="viewer-empty" id="viewer-empty">
<div aria-hidden="true" class="empty-mark">木</div>
<h3>正在连接本地生成器</h3>
<p>初始通过结果会在载入后显示在这里。</p>
</div><iframe class="result-iframe active" hidden="" id="model-view" loading="eager" title="戗角三维模型查看器"></iframe><iframe class="result-iframe" hidden="" id="layout-view" loading="lazy" title="立脚飞椽单列排料方案"></iframe></div><div class="view-switch" role="tablist" aria-label="结果视图"><button aria-controls="model-view" aria-selected="true" class="view-tab active" id="model-tab" role="tab" type="button">
<svg aria-hidden="true" viewbox="0 0 20 20"><path d="m10 2.8 6.6 3.8v6.8L10 17.2l-6.6-3.8V6.6zM3.4 6.6 10 10.4l6.6-3.8M10 10.4v6.8"></path></svg>
              模型
            </button><button aria-controls="layout-view" aria-selected="false" class="view-tab" id="layout-tab" role="tab" type="button">
<svg aria-hidden="true" viewbox="0 0 20 20"><path d="M3 16.5V4.2h14v12.3zM3 13.7l3-1.2 2.5-4.1 2.4 2 3.5-4 2.6 1.1"></path><circle cx="6" cy="12.5" fill="currentColor" r=".9"></circle><circle cx="11" cy="10.4" fill="currentColor" r=".9"></circle></svg>
              排料
            </button><span class="field-note" hidden="" id="layout-disabled-note">精确生成后可用</span></div>
<aside class="control-panel" aria-label="调整形态"><div class="panel-head"><h2>调整形态</h2><button id="panel-toggle" aria-expanded="true" aria-label="收起调整形态">⌃</button></div><div id="panel-body"><div class="parameter-tabs" role="tablist"><button class="selected" data-param-tab="dimensions" role="tab" aria-selected="true">尺寸</button><button data-param-tab="parts" role="tab" aria-selected="false">构件参数</button></div><div class="panel-scroll"><div id="dimensions-page"><div id="quick-fields"></div><details class="more-details"><summary>更多参数</summary><label class="search-label" for="parameter-search">搜索参数</label><input autocomplete="off" disabled="" id="parameter-search" placeholder="搜索参数名称或说明" type="search"/><div id="identity-fields"></div><div id="primary-fields"></div><details id="advanced-details"><summary>其他参数 <span id="advanced-summary-count"></span></summary><div id="advanced-fields"></div></details></details></div><div id="parts-page" hidden><div id="part-fields"></div></div></div><div class="panel-actions"><div id="validation-result" class="validation-result" hidden></div><div id="generation-error" role="alert" hidden></div><button id="generate-button" class="green-button" disabled>更新预览</button><button id="exact-generate-button" class="outline-button" disabled>精确生成</button><section aria-live="polite" class="job-card" hidden="" id="job-card">
<div aria-hidden="true" class="job-mark"><span></span></div>
<div class="job-copy">
<div class="job-title-row">
<h3 id="job-title">正在生成</h3>
<span class="job-elapsed" id="job-elapsed">00:00</span>
</div>
<p class="job-stage" id="job-stage">等待任务状态…</p>
<p class="job-message" id="job-message"></p>
<details class="job-log-details" hidden="" id="job-log-details">
<summary>查看最近日志</summary>
<pre id="job-log"></pre>
</details>
</div>
</section><button id="cancel-button" class="cancel-button" hidden>取消生成</button></div></div></aside>
<div class="view-controls" aria-label="模型视图"><button class="selected" data-camera="iso">轴测</button><button data-camera="top">俯视</button><button data-camera="side">侧视</button><button id="parts-open" aria-expanded="false">构件</button></div><aside id="parts-drawer" class="parts-drawer" hidden><div class="drawer-heading"><strong>构件显示</strong><button id="parts-close" aria-label="关闭">×</button></div><div id="viewer-settings"></div></aside>
<div class="model-status" id="model-status">正在载入</div><div class="draft-status" id="draft-status">参数未修改</div></main>
<dialog id="history-dialog"><div class="dialog-head"><h2>方案与历史</h2><button data-close-dialog aria-label="关闭">×</button></div><select class="select-control" disabled="" id="case-picker">
<option>正在读取案例…</option>
</select><div class="dialog-actions"><button class="button button-secondary" disabled="" id="load-case-button" type="button">载入参数到草稿</button><button class="button button-secondary" disabled="" id="view-case-button" type="button">查看此结果</button></div><div class="dialog-actions"><button class="button button-secondary" disabled="" id="import-button" type="button">
<svg aria-hidden="true" viewbox="0 0 20 20"><path d="M10 13V3m0 0L6.7 6.3M10 3l3.3 3.3M4 12.5v3h12v-3"></path></svg>
                导入 JSON
              </button><button class="button button-secondary" disabled="" id="export-config-button" type="button">
<svg aria-hidden="true" viewbox="0 0 20 20"><path d="M10 3v10m0 0 3.3-3.3M10 13 6.7 9.7M4 13.5v2h12v-2"></path></svg>
                下载配置
              </button><input accept=".json,application/json" class="visually-hidden" id="config-file" type="file"/></div></dialog>
<dialog id="export-dialog"><div class="dialog-head"><h2>导出当前结果</h2><button data-close-dialog aria-label="关闭">×</button></div><div class="download-links" id="result-downloads"></div></dialog><div id="toast" class="toast" role="status" hidden></div><div id="app-error" class="app-error" role="alert" hidden></div>
<div class="internal-state" hidden><span class="angle-mark" id="displayed-angle">—</span><span class="state-pill state-neutral" id="draft-indicator">连接中</span><span class="quiet-count" id="case-count">—</span><span class="quiet-count" id="primary-count">读取中</span><span class="quiet-count" id="advanced-count">折叠</span><span class="state-pill state-neutral" id="validation-indicator">未校验</span><p class="validation-summary" id="validation-summary">检查输入值和已知参数范围；模型形态需在生成后查看。</p><button class="button button-secondary button-grow" disabled="" id="validate-button" type="button">校验参数</button><p class="result-subtitle" id="result-subtitle">编辑草稿与当前显示结果分别保存。</p><span class="result-state-pill" id="result-state"><span class="result-state-dot"></span> 读取结果</span><span class="viewer-case-label" id="viewer-case-label">默认结果</span><span class="validated-tag" hidden="" id="result-validation"><span></span> 精确生成完成</span><div class="metrics-grid" id="result-metrics">
<div class="metric-card metric-placeholder"><span>结果统计</span><strong>载入中</strong></div>
</div><p class="result-footnote" id="result-footnote">排料图为单侧模板，按左右对称制作两套；正身飞椽不计入该排料。曲线平移误差只作诊断，模型保持原角点。</p></div></body></html>
